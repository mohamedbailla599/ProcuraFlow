networks:
  reseau-achats:
    driver: bridge

volumes:
  pg_data:

services:
  postgres-db:
    image: postgres:15-alpine
    container_name: postgres-db
    environment:
      POSTGRES_DB: db_achats_univ
      POSTGRES_USER: admin_achats
      POSTGRES_PASSWORD: pass_secure
    ports:
      - "5433:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - reseau-achats

  service-commandes:
    build: ./service-commandes-yassine/service-commandes
    container_name: service-commandes
    ports:
      - "8082:8082"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres-db:5432/db_achats_univ?currentSchema=schema_commandes
      - SPRING_DATASOURCE_USERNAME=admin_achats
      - SPRING_DATASOURCE_PASSWORD=pass_secure
    depends_on:
      - postgres-db
    networks:
      - reseau-achats