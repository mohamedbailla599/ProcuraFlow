server:
  port: 8083

spring:
  application:
    name: service-receptions
  datasource:
    url: "${DB_URL}"
    username: "${DB_USERNAME}"
    password: "${DB_PASSWORD}"
  flyway:
    schemas: schema_receptions
    default-schema: schema_receptions
    baseline-on-migrate: true
    baseline-version: 0
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

services:
  commandes:
    url: "${COMMANDES_URL}"